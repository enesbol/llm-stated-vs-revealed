[project]
name = "llm-stated-vs-revealed"
version = "0.1.0"
description = "Does elicitation format (stated action vs. artifact production) explain safety-relevant behavior gaps in LLMs? A registered replication/extension of Model Forensics (arXiv 2606.26071)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "openai>=2.17.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "python-dotenv>=1.2.1",
    "pydantic>=2.0",
    "scipy>=1.17.0",
    "numpy>=1.26",
    "huggingface-hub>=0.27.0",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stated_vs_revealed"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
